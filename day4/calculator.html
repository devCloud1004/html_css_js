<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>계산기</title>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("calcBtn").addEventListener("click", function () {
          
          const input = prompt("수식을 입력하세요:", "10 + 2 * 3 - (8 / 2)");
          
          if (!input) return;
          
            try {
              if (/[^0-9\+\-\*\/\(\)\.\s]/.test(input)) {
                throw new Error("올바른 수식이 아닙니다.");
              }
              const result = new Function(`return ${input}`)();
            } catch (e) {
              console.error("계산 오류:", e.message);
              alert("수식을 올바르게 입력해주세요.");
            }
          });
        });
    </script>
  </head>
  <body>
    <h1>계산기</h1>
    <p>계산기 버튼을 눌러 실행</p>
    <button id="calcBtn" type="button">계산하기</button>
  </body>
</html>
