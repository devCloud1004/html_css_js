<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이낸스 USDT 실시간 시세</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #eee; font-size: 15px; border-radius: 4px; }
        .tab-btn.active { background: #007bff; color: white; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .up { color: #28a745; font-weight: bold; }
        .down { color: #dc3545; font-weight: bold; }
        .star { cursor: pointer; font-size: 18px; color: #ccc; user-select: none; }
        .star.fav { color: #f39c12; }
    </style>
    <script>
      const API_URL = 'https://api4.binance.com/api/v3/ticker/24hr';
      
      let tickerData = [];
      let currentTab = 'all';
      let searchQuery = '';
      
      let favorites = JSON.parse(localStorage.getItem('cryptoFavorites')) || [];
  
      const tickerBody = document.querySelector('#tickerBody');
      const searchInput = document.querySelector('#searchInput');
      const tabAll = document.querySelector('#tabAll');
      const tabFav = document.querySelector('#tabFav');
  
      async function fetchTickers() {
          try {
              const response = await fetch(API_URL);
              const data = await response.json();
              
              tickerData = data.filter(item => item.symbol.endsWith('USDT'));
              
              // 화면 갱신
              render();
          } catch (error) {
              console.error('API 데이터 호출 실패:', error);
          }
      }
  
      function render() {
          let filtered = tickerData.filter(item => 
              item.symbol.toLowerCase().includes(searchQuery.toLowerCase())
          );
  
          if (currentTab === 'fav') {
              filtered = filtered.filter(item => favorites.includes(item.symbol));
          }
  
          if (filtered.length === 0) {
              tickerBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">표시할 코인이 없습니다.</td></tr>';
              return;
          }
  
          tickerBody.innerHTML = filtered.map(item => {
              const isFav = favorites.includes(item.symbol);
              const price = parseFloat(item.lastPrice).toLocaleString(undefined, { minimumFractionDigits: 2 });
              const change = parseFloat(item.priceChangePercent);
              const changeClass = change >= 0 ? 'up' : 'down';
              const changeSign = change >= 0 ? '+' : '';
  
              return `
                  <tr>
                      <td>
                          <span class="star ${isFav ? 'fav' : ''}" data-symbol="${item.symbol}">
                              ${isFav ? '★' : '☆'}
                          </span>
                      </td>
                      <td><strong>${item.symbol}</strong></td>
                      <td>${price}</td>
                      <td class="${changeClass}">${changeSign}${change.toFixed(2)}%</td>
                  </tr>
              `;
          }).join('');
      }
  
      //관심항목(LocalStorage 저장)
      function toggleFavorite(symbol) {
          if (favorites.includes(symbol)) {
              favorites = favorites.filter(fav => fav !== symbol);
          } else {
              favorites.push(symbol);
          }
          localStorage.setItem('cryptoFavorites', JSON.stringify(favorites));
          render();
      }
  
      searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          render();
      });
  
      tabAll.addEventListener('click', () => {
          currentTab = 'all';
          tabAll.classList.add('active');
          tabFav.classList.remove('active');
          render();
      });
  
      tabFav.addEventListener('click', () => {
          currentTab = 'fav';
          tabFav.classList.add('active');
          tabAll.classList.remove('active');
          render();
      });
  
      tickerBody.addEventListener('click', (e) => {
          if (e.target.classList.contains('star')) {
              const symbol = e.target.dataset.symbol;
              toggleFavorite(symbol);
          }
      });
  
      fetchTickers();
      setInterval(fetchTickers, 1000);
  </script>
</head>
<body>
<div class="container">
    <h2>바이낸스 USDT 암호화폐 시세</h2>
    
    <div class="tabs">
        <button class="tab-btn active" id="tabAll">전체보기</button>
        <button class="tab-btn" id="tabFav">관심항목</button>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="코인명 검색 (예: BTC, ETH)">
    </div>

    <table>
        <thead>
            <tr>
                <th>관심</th>
                <th>심볼</th>
                <th>현재가 (USDT)</th>
                <th>24시간 변동률</th>
            </tr>
        </thead>
        <tbody id="tickerBody">
            <tr><td colspan="4" style="text-align:center;">데이터를 불러오는 중...</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
